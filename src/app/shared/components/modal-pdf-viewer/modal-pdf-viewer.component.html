<div class="modal-header">
    <h5 class="modal-title">Documento académico</h5>
    <button type="button" class="btn-close" (click)="close()" aria-label="closeModal"></button>
</div>

<div class="modal-body">
    @if (loading) {
    <div class="text-center py-4">
        <div class="spinner-grow text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-success" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-warning" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-info" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-light" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="spinner-grow text-dark" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    }

    @if (error) {
    <div class="text-danger text-center">
        No se pudo cargar el documento. Intente nuevamente más tarde.
    </div>
    }

    @if (pdfUrl) {
    <iframe [src]="pdfUrl" width="100%" height="500px" style="border: 1px solid #ccc;" title="sad">
    </iframe>
    } @else if(imageUrl) {
    <img [src]="imageUrl" alt="Documento" style="max-width: 100%; height: auto; border: 1px solid #ccc;" />
    }

</div>

<div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">Cerrar</button>
</div>
