<div class="card bg-main">
    <div class="card-body p-3">
        <div class="row align-items-center">
            <div class="col-9">
                <p class="text-main mb-0 fw-bold"><i class="fas fa-building"></i> {{ workExperience?.empresa }}</p>
                <p class="text-main mb-0"><i class="fas fa-layer-group"></i> {{ workExperience?.cargo }}</p>
                <p class="text-main mb-0"><i class="fas fa-user-clock"></i> {{workExperience?.fechaInicio || '---'}} <i
                        class="fas fa-arrow-right"></i> {{workExperience?.fechaFin || '---'}}</p>
                <p class="text-main mb-0"><i class="fas fa-clock"></i> {{getWorkTime()}}</p>
            </div>
            <div class="col-3 text-center">
                <i class="fas fa-file-pdf fs-1 text-danger" (click)="onviewPdf()" style="cursor: pointer;"></i>
                <p class="text-main mb-0" (click)="onviewPdf()" style="cursor: pointer;">Descargar PDF</p>
            </div>
        </div>

    </div>
</div>
