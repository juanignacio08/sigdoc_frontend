<div class="card bg-light">
    <div class="card-body pb-1">
        <div class="row g-3">
            <div class="col-12">
                <p class="text-main fw-bold mb-1"><i class="fas fa-building"></i> {{data?.empresa}}</p>
                <p class="text-main mb-1"><i class="fas fa-clipboard-list"></i> {{data?.cargo}}</p>
                <p class="text-main mb-1"><i class="fas fa-clock"></i> {{data?.fechaInicio || '---'}} <i class="fas fa-arrow-right"></i> {{data?.fechaFin || '---'}}</p>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-3">
        <button class="btn btn-icon btn-success" aria-label="descargarPdf" placement="top" ngbTooltip="Ver PDF"
            (click)="onViewPDF()">
            <i class="fas fa-file-pdf"></i>
        </button>
        <button class="btn btn-icon btn-secondary" aria-label="editar" placement="top" ngbTooltip="Editar Información"
            (click)="onEditar()">
            <i class="fas fa-edit"></i>
        </button>
        <button class="btn btn-icon btn-danger me-2" aria-label="eliminar" placement="top" ngbTooltip="Eliminar Información"
            (click)="onDelete()">
            <i class="fas fa-trash-alt"></i>
        </button>
    </div>
</div>
