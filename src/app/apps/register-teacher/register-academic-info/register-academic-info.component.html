@if (loadingOperation) {
<div class="text-center p-5 m-5">
    <div class="spinner-grow text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-success" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-warning" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-info" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-light" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <div class="spinner-grow text-dark" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
} @else {
<div class="row align-items-center mb-0">
    <div class="col-8">
        <p class="fw-bold fs-6 m-0">Lista de Grados Académicos</p>
    </div>
    <div class="col-4 text-end">
        <button class="btn btn-icon icon-left btn-primary m-0" (click)="openModalInformative('add','Registrar Grado Académico' , null)"><i
                class="fas fa-plus"></i> Agregar</button>
    </div>
</div>
<hr class="mt-2">
<div class="row">
    <div class="col-12">
        <ngx-datatable #table class="material" [rows]="academicGradeList" [loadingIndicator]="loadingIndicator"
            columnMode="force" [headerHeight]="50" [footerHeight]="50" rowHeight="auto" [limit]="10"
            [scrollbarH]="scrollBarHorizontal" [reorderable]="reorderable">
            <ngx-datatable-column name="Grado Académico">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.codGradoAcademico.denominacion}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Título Profesional">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.tituloProfesional}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Institución">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.institucionEgreso}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Fecha de Egreso">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.fechaObtencion}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Documento">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.documento}}
                </ng-template>
            </ngx-datatable-column>
            <ngx-datatable-column name="Acciones" [sortable]=false>
                <ng-template let-value="value" let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                    <div class="buttons">
                        <button class="btn btn-icon btn-info btn-sm" placement="top" ngbTooltip="Ver Información"
                            aria-label="ver" (click)="openModalInformative('view', 'Grado Académico', row)"><i class="fas fa-bullseye"></i></button>
                        <button class="btn btn-icon btn-secondary btn-sm" placement="top"
                            ngbTooltip="Editar Información" aria-label="editar" (click)="openModalInformative('edit', 'Editar Información', row)"><i class="far fa-edit"></i></button>
                        <button class="btn btn-icon btn-danger btn-sm" placement="top" ngbTooltip="Eliminar Información"
                            aria-label="eliminar" (click)="openModalInformative('delete', 'Eliminar Información', row)"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>

        <div class="row mt-2">
            <div class="col-12 col-md-4 text-start">
                <button type="button" class="btn btn-info btn-icon icon-left" placement="top"
                    ngbTooltip="Volver al anterior formulario"  [disabled]="!teacherActive" (click)="goToBackStep()"><i class="fas fa-arrow-alt-circle-left"></i>
                    Atras</button>
            </div>
            <div class="col-12 col-md-4 text-center">
                
            </div>
            <div class="col-12 col-md-4 text-end">
                <button type="button" class="btn btn-info btn-icon icon-left" placement="top"
                    ngbTooltip="Avanzar al siguiente formulario"  [disabled]="!teacherActive" (click)="goToNextStep()"><i class="fas fa-arrow-alt-circle-right"></i>
                    Siguiente</button>
            </div>
        </div>
    </div>
</div>
}
