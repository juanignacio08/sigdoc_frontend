<div class="row p-3 pt-4">
    <div class="col-12 text-center text-danger">
        <p class="fs-5 fw-bold">¿Esta seguro de eliminar la información del docente?</p>
        <p class="text-primary pb-0 mb-0">{{teacherActive?.nombre + ' - ' + teacherActive?.apellidoPaterno + ' ' + teacherActive?.apellidoMaterno}}</p>
    </div>
    <div class="col-12 text-center mt-2 mb-0">
        <button class="btn btn-danger me-2" (click)="confirmDelete()">Si</button>
        <button class="btn btn-info ms-2" (click)="close()">No</button>
    </div>
</div>
